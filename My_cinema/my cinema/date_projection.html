<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche Film par Date</title>
    <link rel="stylesheet" href="date_projection .css">
</head>
<body>
    <section id="recherche-film">
        <h2>Rechercher un Film par Date de Projection</h2>
        <form action="#" method="GET">
            <label for="date-projection">Date de Projection :</label>
            <input type="date" id="date-projection" name="date-projection" required>

            <button type="submit">Rechercher</button>
        </form>
    </section>
</body>
</html>
