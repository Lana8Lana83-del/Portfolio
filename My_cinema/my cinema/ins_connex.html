<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription & Connexion</title>
    <link rel="stylesheet" href="ins_connex.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Inscription</h2>
            <form action="#" method="POST" class="form">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">S'inscrire</button>
            </form>
        </div>
        
        <div class="form-container">
            <h2>Connexion</h2>
            <form action="#" method="POST" class="form">
                <label for="email-connexion">Email</label>
                <input type="email" id="email-connexion" name="email-connexion" required>

                <label for="password-connexion">Mot de passe</label>
                <input type="password" id="password-connexion" name="password-connexion" required>

                <button type="submit">Se connecter</button>
            </form>
        </div>
    </div>
</body>
</html>
