<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My_utils</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>


    

    <div class="container">
        
        <h1>My_Todo_List</h1>
        <!--.list-container-->
        <div class="list-container">
            <h2>Liste des tâches à faire</h2>
            <ul id="todo-list"></ul>
        </div>
        

        <div class="list-container">
            <h2>Liste des tâches terminées</h2>
            <ul id="finish"></ul>
        </div>


        <div class="add-task">
            <input type="text" id="task-input" placeholder="Ajouter une tâche">
            <button  id="add-task-btn" >Ajouter</button>
        </div>

    </div>














    <script src="app.js"></script> 
</body>
</html>
