<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une Séance</title>
    <link rel="stylesheet" href="exemple.css">
</head>
<body>
    <header>
        <h1>Ajouter une Séance</h1>
    </header>

    <main>
        <section id="add-session">
            <h2>Formulaire d'ajout de séance</h2>
            <form>
                <input type="text" placeholder="Nom du film" required>
                <input type="date" placeholder="Date de projection" required>
                <input type="time" placeholder="Heure de projection" required>
                <button type="submit">Ajouter Séance</button>
            </form>
        </section>
    </main>
</body>
</html>
