<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cinema</title>
  <link rel="stylesheet" href="siti.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body>
  <header>
    <h1>My Cinema</h1>
    <nav>
      <ul>
        <li><a href="#">Accueil</a></li>
        <li><a href="#">Films</a></li>
        <li><a href="#">Abonnés</a></li>
        <li><a href="#">Ajouter Séance</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="search">
      <h2>Rechercher un Film</h2>
      <form>
        <input type="text" placeholder="Nom du film">
        <select>
          <option>Genre</option>
          <option>Action</option>
          <option>Comédie</option>
        </select>
        <select>
          <option>Distributeur</option>
          <option>Paramount</option>
          <option>Universal</option>
        </select>
        <button type="submit" class="btn btn-primary">Rechercher</button>
      </form>
    </section>

    <section id="subscriptions">
      <h2>Gestion des Abonnés</h2>
      <ul>
        <li><a href="#">Ajouter un Abonné</a></li>
        <li><a href="#">Modifier un Abonnement</a></li>
        <li><a href="#">Afficher l'Historique</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Cinema - Tous droits réservés.</p>
  </footer>
</body>
</html>
